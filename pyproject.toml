[project]
name = "curso-agno"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fábio de Oliveira Freire", email = "freirefabio.ff@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "agno>=2.9.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.35.0",
    "google-genai>=2.18.0",
    "groq>=1.6.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.61.1",
    "tavily-python>=0.7.27",
    "uvicorn>=0.52.3",
    "yfinance>=1.6.0",
]

[project.scripts]
curso-agno = "curso_agno:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
